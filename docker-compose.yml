# docker compose up --build    -> app on http://localhost:4000, rooms saved in the "rooms" volume
# The code runner is a self-hosted Piston (the public one is allow-list only since Feb 2026).
# After the first start, install the language runtimes once:  npm run piston:install
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      PERSISTENCE: file
      RUNNER: piston
      PISTON_URL: http://piston:2000
      RUN_TIMEOUT_MS: "10000"
    volumes:
      - rooms:/data
    depends_on:
      - piston
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston:latest
    # Piston isolates programs with Linux namespaces, which needs a privileged container.
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    restart: unless-stopped

volumes:
  rooms:
  piston-packages:
